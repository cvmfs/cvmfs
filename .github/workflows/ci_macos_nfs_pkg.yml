name: CI_MacOS_NFS_Pkg

# Builds a universal (arm64 + x86_64) macOS development package with the NFS
# frontend, tests it on both architectures and publishes it as
# the `nfs-dev` prerelease, so other workflows can install it without building:
#
#   curl -fLO https://github.com/vvolkl/cvmfs/releases/download/nfs-dev/cvmfs-nfs-dev.pkg
#   sudo installer -pkg cvmfs-nfs-dev.pkg -target /
#   sudo mkdir -p /cvmfs/sft.cern.ch
#   sudo mount -t cvmfs sft.cern.ch /cvmfs/sft.cern.ch

on:
  push:
    branches: [ 'macos/nfs-native' ]
    paths:
      - 'cvmfs/**'
      - 'mount/**'
      - 'ci/nfs4/**'
      - 'packaging/mac/nfs/**'
      - '.github/workflows/ci_macos_nfs_pkg.yml'
  workflow_dispatch:

jobs:
  build_x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Both architectures must bundle the same Homebrew libraries for lipo
      - name: Install build tools
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Build x86_64 stage directory
        run: |
          ./ci/nfs4/pkg.sh . build "x86_64.$(git rev-parse --short HEAD)"
          tar -C build -czf stage-x86_64.tar.gz nfs_pkg_root

      - uses: actions/upload-artifact@v4
        with:
          name: cvmfs-nfs-stage-x86_64
          path: stage-x86_64.tar.gz

  build:
    needs: build_x86_64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cvmfs-nfs-stage-x86_64

      # Both architectures must bundle the same Homebrew libraries for lipo
      - name: Install build tools
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Build universal package
        run: |
          mkdir stage-x86_64
          tar -C stage-x86_64 -xzf stage-x86_64.tar.gz
          CVMFS_PKG_MERGE_STAGE=$PWD/stage-x86_64/nfs_pkg_root \
            ./ci/nfs4/pkg.sh . build "$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          pkgutil --payload-files build/pkg_result/cvmfs-*.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: cvmfs-nfs-pkg
          path: build/pkg_result/cvmfs-*.pkg

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Built on macos-15: newer macOS runs it, older would not load the
        # bundled Homebrew libraries (minimum OS = the build runner's)
        os: [ macos-15, macos-15-intel, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cvmfs-nfs-pkg

      - name: Install
        run: |
          uname -m
          sudo installer -pkg cvmfs-*.pkg -target / \
            || { cat /tmp/cvmfs_postinstall; exit 1; }
          cat /tmp/cvmfs_postinstall
          ! grep -E "Read-only file system|DS Error" /tmp/cvmfs_postinstall
          ls -la /cvmfs/
          for f in /usr/local/bin/cvmfs2 /usr/local/lib/libcvmfs_nfs.dylib; do
            lipo -archs $f
          done
          printf 'CVMFS_HTTP_PROXY=DIRECT\nCVMFS_USE_CDN=yes\n' \
            | sudo tee /etc/cvmfs/default.local
          sudo cvmfs_config chksetup || true

      - name: Mount and read
        run: |
          sudo launchctl limit maxfiles 65536 65536
          sudo mkdir -p /cvmfs/sft.cern.ch
          sudo mount -t cvmfs sft.cern.ch /cvmfs/sft.cern.ch
          mount | grep /cvmfs/sft.cern.ch
          ls /cvmfs/sft.cern.ch/lcg/views | head
          setup=/cvmfs/sft.cern.ch/lcg/views/LCG_110a/arm64-mac15-clang170-opt/setup.sh
          head -5 $setup
          shasum $setup
          sudo cvmfs_talk -i sft.cern.ch revision
          sudo umount /cvmfs/sft.cern.ch
          ! mount | grep /cvmfs/sft.cern.ch

      - name: Collect logs
        if: ${{ failure() }}
        run: |
          cat /tmp/cvmfs_postinstall || true
          sudo log show --last 30m --style compact \
            --predicate 'process == "cvmfs2" OR process == "mount_nfs"' | tail -200 || true

  publish:
    needs: [ build, test ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cvmfs-nfs-pkg

      - name: Update nfs-dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Development build of the macOS NFS frontend from ${GITHUB_SHA} (${GITHUB_REF_NAME}). Not for production."
          if gh release view nfs-dev > /dev/null 2>&1; then
            for asset in $(gh release view nfs-dev --json assets -q '.assets[].name'); do
              gh release delete-asset nfs-dev "$asset" --yes
            done
            gh release edit nfs-dev --notes "$notes"
          else
            gh release create nfs-dev --prerelease --title "cvmfs macOS NFS dev build" \
              --notes "$notes"
          fi
          # Stable name for a fixed download URL
          cp cvmfs-*.pkg cvmfs-nfs-dev.pkg
          gh release upload nfs-dev cvmfs-*.pkg
