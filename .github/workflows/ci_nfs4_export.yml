name: CI_NFS4_Export

# Mounts cvmfs_nfs4_export with the built-in NFS client of hosted runners,
# which (unlike macFUSE/FSKit) needs no kernel extension

on:
  push:
    paths:
      - 'cvmfs/nfs4/**'
      - 'ci/nfs4/**'
      - '.github/workflows/ci_nfs4_export.yml'
  pull_request:
    paths:
      - 'cvmfs/nfs4/**'
      - 'ci/nfs4/**'
      - '.github/workflows/ci_nfs4_export.yml'
  workflow_dispatch:

jobs:
  mount_test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common uuid-dev attr libcap-dev

      - name: Build cvmfs_nfs4_export
        run: |
          cmake -S . -B build \
            -DBUILD_CVMFS=OFF -DBUILD_LIBCVMFS=OFF -DBUILD_LIBCVMFS_CACHE=OFF \
            -DBUILD_SERVER=OFF -DBUILD_RECEIVER=OFF -DBUILD_GEOAPI=OFF \
            -DBUILD_MANPAGES=OFF -DBUILD_NFS4_EXPORT=ON
          cmake --build build --target cvmfs_nfs4_export -j 4

      - name: Mount and compare
        run: |
          sw_vers 2>/dev/null || cat /etc/os-release
          ./ci/nfs4/export_mount_test.sh build/cvmfs/cvmfs_nfs4_export cvmfs
