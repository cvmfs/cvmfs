# Enable the macFUSE FSKit backend (macFUSE >= 5.4.0)
# Mount points appear under /Volumes/cvmfs instead of /Users/Shared/cvmfs
CVMFS_USE_MACFUSE_FSKIT=yes

# FSKit mounts are unprivileged: cvmfs runs as the mounting user with
# per-user cache and socket directories.  Resolve the invoking user also
# under sudo so that cvmfs_config and cvmfs_talk find the same directories
# as the unprivileged cvmfs2 process.
CVMFS_USER=${SUDO_USER:-$(whoami)}
CVMFS_CACHE_BASE=$(eval echo "~$CVMFS_USER")/Library/Caches/cvmfs
CVMFS_RELOAD_SOCKETS=$CVMFS_CACHE_BASE/run
