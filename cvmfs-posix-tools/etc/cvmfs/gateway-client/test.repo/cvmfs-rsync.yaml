repos:
  test.repo:
    dot-scheme: false
    content-addressable: true
    groups:
      DEFAULT:
        DEFAULT:
          allow-delete: true
          allow-purge: true
          allow-upload: true
          allow-acl: true
          check-permissions: true
          directory-mode: 511
          file-mode: 438
          group: 0
          user: 0
    proxy: <VARNISH PROXY URL>
    external-url-prefix: <BUCKET URL FOR EXTERNAL DATA>
    internal-url-prefix: <BUCKET URL FOR INTERNAL DATA, cvmfs data/, eg http://minio/test.repo/data
    s3_access_key: <key for buckets>
    s3_secret_key: <key for buckets>
