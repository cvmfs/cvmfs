# This file is part of the CernVM File System.

services:
    cvmfs-dev:
        image: ghcr.io/vvolkl/cvmfs-dev:latest
        container_name: cvmfs-dev
        hostname: cvmfs-dev
        privileged: true
        cgroup: host # required to run sbin/init with cgroups v2
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup
            - var_spool_cvmfs:/var/spool/cvmfs
            - ../../../:/home/sftnight/cvmfs

volumes:
    var_spool_cvmfs:

