################################################################################
#       CVMFS Benchmark Visualizer - Example YAML config
################################################################################
# Mandatory parameters are marked with MAND
#
# How filenames look like created by start_benchmark:
# <cmd>_<version>-<custom version tag>_<client config 1>_.._<client config n>_<num threads>_<run>.csv
#
# e.g.: root_2.11.0.0-bisect_symlink_statfs_kernel_32_0.csv

#################################################
##              General options
#################################################
global_build_name_and_config_labels:
  "2.12.0.0_unprivileged": "Unprivileged 2.12.0"

###############################################
#              PLOTS
###############################################

tensorflow_scatter_plot:
  type: "scatter_plot"
  in_dirname: 
  - ./data/run-cvmfs-unprivileged-1/
  - ./data/run-cvmfs-unprivileged-2/
  out_dirname: ./results/tensorflow/scatterplots/
  time_metrics: ["user,system,real", "real"]
  plot: False

tensorflow_append_to_csv:
  type: "append_to_csv"
  in_dirname: 
  - ./data/run-cvmfs-unprivileged-1/
  full_out_name: ./results/tensorflow/append_to_csv/all_my_data.csv
  tag: "Unprivileged run 1"
  time_metrics: ["real"]
  write : False

tensorflow_append_to_csv_2:
  type: "append_to_csv"
  in_dirname: 
  - ./data/run-cvmfs-unprivileged-2/
  full_out_name: ./results/tensorflow/append_to_csv/all_my_data.csv
  tag: "Unprivileged run 2"
  time_metrics: ["real"]
  write : False

tensorflow_append_to_csv_3: # just to show that it works on the same file
  type: "append_to_csv" 
  in_dirname: 
  - ./data/run-cvmfs-1/
  full_out_name: ./results/tensorflow/append_to_csv/all_my_data.csv
  tag: "Privileged run"
  time_metrics: ["real"]
  write : False

tensorflow_client_and_config_comparison:
  type: "client_and_config_comparison"
  title: "Comparison: Privileged vs Unprivileged Run Tensorflow"
  in_dirname: 
  - ./data/run-cvmfs-unprivileged-1/
  - ./data/run-cvmfs-unprivileged-2/
  - ./data/run-cvmfs-1/
  out_dirname: ./results/tensorflow/client_and_config_comparison
  num_threads: [2, 4]
  # build_name_and_config_labels:
  # (MAND)
  build_name_and_config: [
    "2.12.0.0_unprivileged",
    "2.12.0.0-sudo_default"
  ]
  build_name_and_config_labels: 
    "2.12.0.0_unprivileged": "Unprivileged"
    "2.12.0.0-sudo_default" : "Privileged"
  time_metrics: ["real"]
  internal_affairs_repos: ["sft.cern.ch"]
  plot: True
